<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Café</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #fff3d6, #ffffff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }
    .card {
      max-width: 430px;
      width: 100%;
      background: white;
      border-radius: 28px;
      padding: 30px 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }
    .logo {
      width: 100%;
      max-width: 330px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 10px 0;
      color: #e85d04;
      font-size: 32px;
    }
    p {
      color: #555;
      font-size: 17px;
      margin-bottom: 28px;
    }
    .btn {
      display: block;
      background: linear-gradient(90deg, #ffb703, #fb8500);
      color: white;
      text-decoration: none;
      padding: 18px;
      border-radius: 18px;
      font-size: 21px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="Logo.png" class="logo" alt="Fruit Café Logo">
    <h1>Willkommen</h1>
    <p>Hier finden Sie unsere aktuelle Speisekarte.</p>
    <a class="btn" href="Fruit Cafe Karte_compressed.pdf="_blank">📖 Speisekarte öffnen</a>
  </div>
</body>
</html>
